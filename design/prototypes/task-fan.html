<!doctype html>
<html><head><meta charset="utf-8">
<style>
:root{--holo:#5fe6ff;--holo2:#2bb8e0;--amber:#ffb347;--bg1:#0b1220;--bg2:#141d33}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1600px;height:900px;overflow:hidden;background:#05080f;font-family:Inter,sans-serif}
#desk{position:absolute;inset:0;
 background:
  radial-gradient(ellipse at 20% 15%,#1d2b4a 0,transparent 55%),
  radial-gradient(ellipse at 85% 90%,#14243a 0,transparent 60%),
  linear-gradient(160deg,#0d1424,#070b14);}
/* fake desktop apps */
.app{position:absolute;background:#1b2130;border:1px solid #2a3245;border-radius:8px;box-shadow:0 10px 30px #0008;overflow:hidden}
.app .bar{height:30px;background:#232a3b;display:flex;align-items:center;padding:0 12px;color:#8a93a8;font-size:12px;gap:8px}
.app .line{height:8px;border-radius:4px;background:#2b3448;margin:12px 16px}
#taskbar{position:absolute;left:0;right:0;bottom:0;height:48px;background:#0e1320ee;border-top:1px solid #222a3c;display:flex;justify-content:center;align-items:center;gap:10px}
#taskbar i{width:30px;height:30px;border-radius:6px;background:#26304a;display:block}
#taskbar .clock{position:absolute;right:16px;color:#9aa4ba;font-size:12px;text-align:right;line-height:1.3}
#dim{position:absolute;inset:0;background:radial-gradient(circle at var(--ox) var(--oy),#02101aaa 0,#000c 70%);opacity:0;transition:none}

/* ORB */
#orb{position:absolute;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;z-index:50}
#orb .core{position:absolute;inset:22px;border-radius:50%;
 background:radial-gradient(circle at 42% 38%,#eaffff 0,#8ef1ff 18%,#1fb6e6 45%,#0a4f78 75%,#04233a 100%);
 box-shadow:0 0 25px #34d4ff88,0 0 60px #1aa8e055, inset 0 0 18px #0009}
#orb .ring{position:absolute;inset:6px;border-radius:50%;border:2px solid #5fe6ff66;box-shadow:0 0 12px #5fe6ff44}
#orb .ring2{position:absolute;inset:0;border-radius:50%;border:1px dashed #5fe6ff44}
#orb .tick{position:absolute;inset:-6px;border-radius:50%;
 background:conic-gradient(from 0deg,#5fe6ff 0 4deg,transparent 4deg 30deg,#5fe6ff 30deg 32deg,transparent 32deg 90deg,#5fe6ff 90deg 94deg,transparent 94deg 180deg,#5fe6ff 180deg 184deg,transparent 184deg 270deg,#5fe6ff 270deg 272deg,transparent 272deg);
 -webkit-mask:radial-gradient(circle,transparent 62px,#000 63px,#000 66px,transparent 67px);opacity:.7}
#orb.active .core{box-shadow:0 0 40px #5fe6ffcc,0 0 120px #1aa8e099,0 0 220px #1aa8e044, inset 0 0 18px #0006}
#orb.active .ring{border-color:#9ff3ff;box-shadow:0 0 22px #5fe6ff99}
#orb .label{position:absolute;top:128px;left:50%;transform:translateX(-50%);white-space:nowrap;color:#9fefffcc;font:600 11px 'DejaVu Sans Mono',monospace;letter-spacing:3px}

/* HOLO WINDOWS */
#stage{position:absolute;inset:0;perspective:1400px;z-index:40}
.w{position:absolute;width:310px;margin-left:-155px;margin-top:-85px;color:#c9f7ff;
 background:linear-gradient(180deg,#0e4b6a33,#06263a40);
 border:1px solid #5fe6ff88;border-radius:4px;
 box-shadow:0 0 18px #2bb8e055, inset 0 0 30px #2bb8e022;
 backdrop-filter:blur(3px);transform-origin:50% 50%;overflow:hidden;
 font-size:12px}
.w::before{content:"";position:absolute;inset:0;pointer-events:none;
 background:repeating-linear-gradient(0deg,#5fe6ff10 0 1px,transparent 1px 3px);mix-blend-mode:screen}
.w::after{content:"";position:absolute;inset:-1px;pointer-events:none;
 background:
  linear-gradient(var(--holo),var(--holo)) top left/14px 2px no-repeat,
  linear-gradient(var(--holo),var(--holo)) top left/2px 14px no-repeat,
  linear-gradient(var(--holo),var(--holo)) top right/14px 2px no-repeat,
  linear-gradient(var(--holo),var(--holo)) top right/2px 14px no-repeat,
  linear-gradient(var(--holo),var(--holo)) bottom left/14px 2px no-repeat,
  linear-gradient(var(--holo),var(--holo)) bottom left/2px 14px no-repeat,
  linear-gradient(var(--holo),var(--holo)) bottom right/14px 2px no-repeat,
  linear-gradient(var(--holo),var(--holo)) bottom right/2px 14px no-repeat;}
.w.warn{border-color:#ffb347aa;box-shadow:0 0 22px #ffb34755, inset 0 0 30px #ffb34722;--holo:#ffb347;color:#ffe6c4;background:linear-gradient(180deg,#6a4a0e33,#3a2606 40)}
.w .hd{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid #5fe6ff44;font:700 10px 'DejaVu Sans Mono',monospace;letter-spacing:2px;color:var(--holo);text-transform:uppercase}
.w.warn .hd{border-color:#ffb34755}
.w .hd .dot{width:7px;height:7px;border-radius:50%;background:var(--holo);box-shadow:0 0 8px var(--holo)}
.w .hd .x{margin-left:auto;opacity:.6}
.w .bd{padding:10px 12px;line-height:1.45}
.w .t{font-size:15px;font-weight:600;color:#effcff;margin-bottom:4px}
.w.warn .t{color:#fff3e0}
.w .m{font:11px 'DejaVu Sans Mono',monospace;opacity:.8}
.w .bar{height:5px;background:#5fe6ff22;border-radius:3px;margin:9px 0 5px;overflow:hidden}
.w .bar b{display:block;height:100%;background:linear-gradient(90deg,#2bb8e0,#bff7ff);box-shadow:0 0 8px #5fe6ff}
.w .log{font:10.5px 'DejaVu Sans Mono',monospace;opacity:.75;margin-top:6px;white-space:nowrap;overflow:hidden}
.w .btns{display:flex;gap:6px;margin-top:9px}
.w .btns span{border:1px solid var(--holo);padding:3px 9px;border-radius:2px;font:600 10px 'DejaVu Sans Mono',monospace;color:var(--holo);letter-spacing:1px}
.w .steps{display:flex;gap:4px;margin-top:8px}
.w .steps i{flex:1;height:14px;border:1px solid #5fe6ff66;font:9px 'DejaVu Sans Mono';color:#9fefff;display:flex;align-items:center;justify-content:center;font-style:normal}
.w .steps i.ok{background:#5fe6ff33}
.w .steps i.run{background:linear-gradient(90deg,#5fe6ff55,transparent)}
.ghost{position:absolute;width:310px;height:170px;margin-left:-155px;margin-top:-85px;border:1px solid #5fe6ff;border-radius:4px;background:#5fe6ff10;box-shadow:0 0 14px #5fe6ff66;pointer-events:none}
svg#links{position:absolute;inset:0;z-index:35;overflow:visible}
#cone{position:absolute;z-index:30;pointer-events:none}
#caption{position:absolute;left:24px;top:20px;z-index:60;color:#cfeaff;font:600 13px Inter;letter-spacing:.5px;background:#0009;border:1px solid #5fe6ff44;padding:8px 12px;border-radius:6px}
#caption b{color:#5fe6ff;font-family:'DejaVu Sans Mono';letter-spacing:2px;margin-right:8px}
#hud{position:absolute;z-index:45;pointer-events:none}
</style></head><body>
<div id="desk">
  <div class="app" style="left:70px;top:90px;width:620px;height:420px"><div class="bar">● ● ●  Visual Studio — Kazo.Jarvis</div>
   <div class="line" style="width:60%"></div><div class="line" style="width:80%"></div><div class="line" style="width:45%"></div><div class="line" style="width:70%"></div><div class="line" style="width:55%"></div><div class="line" style="width:75%"></div></div>
  <div class="app" style="left:560px;top:180px;width:560px;height:360px"><div class="bar">● ● ●  Navigateur</div>
   <div class="line" style="width:40%"></div><div class="line" style="width:85%"></div><div class="line" style="width:65%"></div></div>
  <div id="taskbar"><i></i><i></i><i></i><i></i><i></i><i></i><div class="clock">20:49<br>2026-11-18</div></div>
</div>
<div id="dim"></div>
<svg id="links"></svg>
<div id="cone"></div>
<div id="stage"></div>
<div id="hud"></div>
<div id="orb"><div class="tick"></div><div class="ring2"></div><div class="ring"></div><div class="core"></div><div class="label">JARVIS</div></div>
<div id="caption"></div>
<script>
const P=new URLSearchParams(location.search);
const V=P.get('v')||'A', S=P.get('s')||'open';
const T={closed:0,mid:.42,open:1,suck:.3}[S];
const tasks=[
 {k:'Claude Code',t:'Refactor Kazo.Bar — Plugins',m:'session 3f2a · claude -p',p:62,log:'› Edit src/Plugins/Loader.cs (+48 −12)'},
 {k:'Tâche planifiée',t:'Résumé du matin',m:'prochaine exécution 07:30',p:0,log:'Gmail · Agenda · Météo',sched:1},
 {k:'GitHub Actions',t:'Kazo-ca/Jarvis — build #42',m:'branche spikes/base',steps:1},
 {k:'Home Assistant',t:'Surveillance : Mode nuit',m:'déclencheur WebSocket actif',log:'3 lumières encore allumées en bas'},
 {k:'Décision requise',t:'Claude attend votre accord',m:'écrire dans C:\\jarvis\\OpenJarvis ?',warn:1},
];
function html(o){
 let b=`<div class="hd"><span class="dot"></span>${o.k}<span class="x">✕</span></div><div class="bd"><div class="t">${o.t}</div><div class="m">${o.m}</div>`;
 if(o.p) b+=`<div class="bar"><b style="width:${o.p}%"></b></div><div class="m">${o.p}% · 14 min</div>`;
 if(o.steps) b+=`<div class="steps"><i class="ok">restore</i><i class="ok">build</i><i class="run">test</i><i>pack</i></div>`;
 if(o.log) b+=`<div class="log">${o.log}</div>`;
 if(o.warn) b+=`<div class="btns"><span>AUTORISER</span><span>REFUSER</span><span>DÉTAILS</span></div>`;
 return b+'</div>';
}
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
let orb, slots, caption;
if(V==='A'){ // fan arc from bottom-right orb
 orb={x:1420,y:740}; caption='<b>A</b>Éventail — les fenêtres jaillissent en arc autour de l’orbe';
 const R=[560,600,620,600,560], ang=[183,203,224,246,268];
 const R2=[[1010,700],[880,500],[960,290],[1200,120],[1390,380]];
 const K=P.get('c')||'br'; const fx=K[1]==='l', fy=K[0]==='t';
 if(fx) orb.x=1600-orb.x; if(fy) orb.y=900-48-orb.y+20;
 slots=R2.map(([x,y],i)=>({x:fx?1600-x:x,y:fy?900-48-y+20:y,rx:0,ry:(fx?1:-1)*(8-i*2),rz:0,s:1}));
 if(fy) slots.forEach(s=>s.y+=10);
 caption+=' · coin '+{br:'bas droite',bl:'bas gauche',tr:'haut droite',tl:'haut gauche'}[K];
}else if(V==='B'){ // orbital ring
 orb={x:800,y:520}; caption='<b>B</b>Orbite — les fenêtres tournent en anneau 3D autour de l’orbe';
 const n=5, rx=560, ry=210;
 slots=[...Array(n)].map((_,i)=>{const a=Math.PI/2+i*2*Math.PI/n; const d=(Math.sin(a)+1)/2; // 1=front
   return {x:orb.x+rx*Math.cos(a), y:orb.y-40+ry*Math.sin(a)-(1-d)*90+(d>.95?70:0), rx:0, ry:-Math.cos(a)*35, rz:0, s:.68+.38*d, o:.55+.45*d, z:Math.round(d*10)}});
}else{ // curved wall projected upward
 orb={x:800,y:730}; caption='<b>C</b>Projection — un mur holographique courbe se déploie au-dessus de l’orbe';
 const cols=[-2,-1,0,1,2];
 slots=cols.map(c=>({x:800+c*330 - c*Math.abs(c)*8, y:330+Math.abs(c)*28, rx:6, ry:-c*16, rz:0, s:1-Math.abs(c)*.06}));
}
document.getElementById('caption').innerHTML=caption+(S==='closed'?' · <span style="opacity:.7">état fermé (orbe immobile)</span>':S==='mid'?' · <span style="opacity:.7">animation de sortie</span>':S==='suck'?' · <span style="opacity:.7">aspiration</span>':' · <span style="opacity:.7">ouvert</span>');
{const k=P.get('c')||'',c=document.getElementById('caption'); if(k.startsWith('t')){c.style.top='auto';c.style.bottom='64px';} if(k.endsWith('l')){c.style.left='auto';c.style.right='24px';}}
const ob=document.getElementById('orb'); ob.style.left=orb.x+'px'; ob.style.top=orb.y+'px';
if(T>0) ob.classList.add('active');
const dim=document.getElementById('dim'); dim.style.setProperty('--ox',orb.x+'px');dim.style.setProperty('--oy',orb.y+'px'); dim.style.opacity=T*0.85;
const stage=document.getElementById('stage'), svg=document.getElementById('links');
function place(el,sl,t,i){
 const e=ease(t);
 const x=orb.x+(sl.x-orb.x)*e, y=orb.y+(sl.y-orb.y)*e;
 const sc=(0.06+0.94*e)*(sl.s||1);
 const spin = V==='B' ? (1-e)*90 : 0;
 el.style.left=x+'px'; el.style.top=y+'px';
 el.style.transform=`rotateX(${sl.rx*e}deg) rotateY(${(sl.ry||0)*e+spin}deg) rotateZ(${(1-e)*(i%2?-25:25)}deg) scale(${sc})`;
 el.style.opacity=Math.min(1,(.15+t*1.2))*(sl.o||1);
 if(sl.z!=null) el.style.zIndex=sl.z;
 return {x,y};
}
if(T>0){
 tasks.forEach((o,i)=>{
  const sl=slots[i];
  const w=document.createElement('div'); w.className='w'+(o.warn?' warn':''); w.innerHTML=html(o); stage.appendChild(w);
  const pos=place(w,sl,T,i);
  if(S==='mid'||S==='suck'){
    w.style.filter='blur(.4px) brightness(1.4)';
    for(let g=1;g<=3;g++){ const gh=document.createElement('div'); gh.className='ghost';
      const tg = S==='mid'? T-g*0.09 : T+g*0.09; stage.appendChild(gh); place(gh,sl,Math.max(0.02,tg),i); gh.style.opacity=.35/g; }
  }
  // link beam
  const col=o.warn?'#ffb347':'#5fe6ff';
  const p=document.createElementNS('http://www.w3.org/2000/svg','path');
  const mx=(orb.x+pos.x)/2+(V==='A'?0:(pos.y-orb.y)*0.15), my=(orb.y+pos.y)/2-(V==='C'?0:30);
  p.setAttribute('d',`M${orb.x},${orb.y} Q${mx},${my} ${pos.x},${pos.y}`);
  p.setAttribute('stroke',col); p.setAttribute('fill','none');
  p.setAttribute('stroke-width', S==='open'?1.2:2.5); p.setAttribute('stroke-opacity', S==='open'?.45:.8);
  if(S==='open') p.setAttribute('stroke-dasharray','2 5');
  p.setAttribute('style',`filter:drop-shadow(0 0 4px ${col})`);
  if(V!=='C') svg.appendChild(p);
 });
 if(S==='suck'||S==='mid'){ // particles swirl
  for(let k=0;k<70;k++){const a=Math.random()*Math.PI*2, r=40+Math.random()*(S==='suck'?260:200);
   const c=document.createElementNS('http://www.w3.org/2000/svg','circle'); c.setAttribute('cx',orb.x+Math.cos(a)*r); c.setAttribute('cy',orb.y+Math.sin(a)*r*.7);
   c.setAttribute('r',Math.random()*1.8+.5); c.setAttribute('fill','#bff7ff'); c.setAttribute('opacity',(1-r/300)*.9); svg.appendChild(c);}
 }
 if(V==='C'){ // light cone
  const cone=document.getElementById('cone'); const topY=150, h=orb.y-topY-120;
  cone.style.cssText+=`left:${orb.x-640}px;top:${topY+120}px;width:1280px;height:${h}px;clip-path:polygon(${50-50*ease(T)}% 0,${50+50*ease(T)}% 0,51.5% 100%,48.5% 100%);background:linear-gradient(0deg,#5fe6ff55,#5fe6ff08 70%,transparent);opacity:${.5+.5*T}`;
 }
 if(V==='B'){ // orbit ellipse
  const e=document.createElementNS('http://www.w3.org/2000/svg','ellipse'); e.setAttribute('cx',orb.x); e.setAttribute('cy',orb.y+20); e.setAttribute('rx',560*ease(T)); e.setAttribute('ry',150*ease(T));
  e.setAttribute('fill','none'); e.setAttribute('stroke','#5fe6ff'); e.setAttribute('stroke-opacity',.35); e.setAttribute('stroke-dasharray','6 8'); svg.prepend(e);
 }
 if(V==='A' && S==='open'){ // arc gauge
  const a=document.createElementNS('http://www.w3.org/2000/svg','path'); const r=170;
  const K2=P.get('c')||'br', sx=K2[1]==='l'?-1:1, sy=K2[0]==='t'?-1:1; a.setAttribute('d',`M${orb.x-sx*r},${orb.y} A${r},${r} 0 0 ${sx*sy>0?1:0} ${orb.x},${orb.y-sy*r}`); a.setAttribute('stroke','#5fe6ff'); a.setAttribute('fill','none'); a.setAttribute('stroke-width',3); a.setAttribute('stroke-opacity',.5); svg.appendChild(a);
  const t=document.createElementNS('http://www.w3.org/2000/svg','text'); t.setAttribute('x',sx>0?orb.x-430:orb.x+200); t.setAttribute('y',sy>0?orb.y+105:orb.y-90); t.setAttribute('fill','#9fefff'); t.setAttribute('style','font:600 11px DejaVu Sans Mono;letter-spacing:2px'); t.textContent='5 TÂCHES ACTIVES · 1 DÉCISION'; svg.appendChild(t);
 }
 if(S==='open'){ // hud text near orb
  const h=document.getElementById('hud'); h.style.cssText+=`left:${orb.x+(V==='B'?-110:90)}px;top:${orb.y+(V==='B'?-120:-10)}px;width:220px;text-align:${V==='B'?'center':'left'};color:#9fefff;font:600 10px DejaVu Sans Mono;letter-spacing:2px;opacity:.8`;
  if(V!=='A') h.textContent='5 TÂCHES ACTIVES · 1 DÉCISION · CLIC POUR RANGER';
 }
}else{
 const h=document.getElementById('hud'); h.style.cssText+=`left:${orb.x-110}px;top:${orb.y-115}px;white-space:nowrap;color:#9fefffcc;font:600 10px DejaVu Sans Mono;letter-spacing:1.5px;line-height:1.6`;
 h.innerHTML='<span style="display:inline-block;border:1px solid #5fe6ff66;padding:4px 8px;background:#06263a99">● 5 tâches · clic pour ouvrir</span>';
}
</script></body></html>
